<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foreman Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c6cff'/%3E%3Cpath d='M9 22V10h13v3h-9v2.5h7.5v3H13V22z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">F</div>
        <div>
          <div class="brand-name">Foreman <span class="brand-sep">/</span> <span id="project">—</span></div>
          <div class="brand-sub"><span id="release">Loading…</span></div>
        </div>
      </div>

      <div class="kpis" id="kpis">
        <div class="kpi kpi-progress">
          <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
            <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
            <circle class="ring-fg" id="ring" cx="22" cy="22" r="18"></circle>
          </svg>
          <div><div class="kpi-val" id="k-progress">0/0</div><div class="kpi-lbl">Tasks done</div></div>
        </div>
        <div class="kpi"><div class="kpi-val" id="k-blocked">0</div><div class="kpi-lbl">Blocked</div></div>
        <div class="kpi"><div class="kpi-val" id="k-overdue">0</div><div class="kpi-lbl">Overdue</div></div>
        <div class="kpi"><div class="kpi-val" id="k-approval">0</div><div class="kpi-lbl">Awaiting approval</div></div>
        <div class="kpi"><div class="kpi-val" id="k-days">—</div><div class="kpi-lbl">Days to release</div></div>
      </div>

      <div class="top-right">
        <div class="health" id="health" data-v="">
          <span class="health-dot"></span><span id="health-txt">—</span>
        </div>
        <div class="live" id="live" title="Refreshes every 2 seconds"><span class="live-dot"></span><span id="live-txt">Connecting</span></div>
        <button class="icon-btn" id="theme" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </div>
    </header>

    <div class="risk-banner" id="risk-banner" hidden></div>

    <main class="layout">
      <section class="board" id="board" aria-label="Task board"></section>

      <aside class="rail">
        <section class="panel">
          <div class="panel-head"><h2>Agents</h2><span class="panel-note">in #project-room</span></div>
          <div id="agents" class="agents"></div>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>Team workload</h2><span class="panel-note">open tasks</span></div>
          <div id="team" class="team"></div>
        </section>

        <section class="panel panel-grow">
          <div class="panel-head"><h2>Live activity</h2><span class="panel-note" id="act-count"></span></div>
          <ol id="feed" class="feed"></ol>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>Latest report</h2><span class="panel-note" id="report-name"></span></div>
          <div id="report" class="report"></div>
        </section>
      </aside>
    </main>

    <footer class="foot">
      Read-only view. Every change happens in the Switch room through <code>scripts/board.py</code>.
    </footer>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
